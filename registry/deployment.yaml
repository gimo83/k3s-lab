################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: docker-registry

---
###############################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: docker-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: docker-registry
  labels:
    app: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      containers:
      - name: registry
        image: docker.io/library/registry:3.1
        ports:
          - containerPort: 5000
            name: registry-port
        volumeMounts:
          - name: registry-storage
            mountPath: /var/lib/registry
      volumes:
        - name: registry-storage
          persistentVolumeClaim:
            claimName: registry-pvc
---
###################################################################
apiVersion: v1
kind: Service
metadata:
  name: docker-registry-service
  namespace: docker-registry
spec:
  selector:
    app: docker-registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP

---
###################################################################
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-ingress
  namespace: docker-registry
  annotations:
    # Traefik configuration to support large image uploads
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Adjust this value if you upload huge Docker images
    ingress.kubernetes.io/proxy-body-size: "2g" 
spec:
  ingressClassName: traefik
  rules:
    - host: registry.k3s.lan  # <-- Change this to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docker-registry-service
                port:
                  number: 5000



